<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Dreams Nana Sayang 🌠</title>
    <style>
        /* Menggunakan font Fredoka yang bulat, tebal, dan bukan huruf sambung */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');

        :root {
            --pink: #FFB6C1;
            --blue: #A2D2FF;
            --white: #FFFFFF;
            --deep-blue: #1a1a2e;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* Running Text Atas */
        .marquee-container {
            position: absolute;
            top: 20px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px 0;
            z-index: 100;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 1.3em;
            color: var(--pink);
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* Dashboard Utama */
        .dashboard {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 30px rgba(162, 210, 255, 0.3);
            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .main-text {
            font-size: 3.5em;
            margin: 0;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Efek Glow Pink & Biru */
            text-shadow: 
                0 0 10px var(--pink),
                0 0 20px var(--blue),
                0 0 30px var(--pink);
        }

        .emot {
            font-size: 2.5em;
            display: block;
            margin-bottom: 15px;
        }

        /* Efek Bintang Jatuh (Shooting Star) */
        .shooting-star {
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, white, transparent);
            animation: shoot 3s linear infinite;
            z-index: 1;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translate(-100px, -100px) rotate(45deg); opacity: 1; }
            100% { transform: translate(120vw, 120vh) rotate(45deg); opacity: 0; }
        }

        /* Hati Kecil dari Bawah */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 1.2em;
            animation: rise linear forwards;
            opacity: 0.7;
        }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        .goodnight-msg {
            font-size: 1.2em;
            color: var(--blue);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="shooting-stars"></div>

    <div class="marquee-container">
        <div class="marquee-text">
            Sasaa sayang Nana • I love you sayang • Tidur yang nyenyak ya Sayang• Mimpi indah sayangku...
        </div>
    </div>

    <div class="dashboard">
        <span class="emot">(づ｡◕‿‿◕｡)づ</span>
        <h1 class="main-text">SWEET DREAMS<br>YA SAYAANG</h1>
        <p class="goodnight-msg">Istirahat ya, aku tunggu di mimpi! ✨</p>
    </div>

    <script>
        // Fungsi bikin bintang jatuh
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.top = Math.random() * 50 + 'vh';
            star.style.left = Math.random() * 50 + 'vw';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.getElementById('shooting-stars').appendChild(star);
            
            setTimeout(() => { star.remove(); }, 3000);
        }

        // Fungsi bikin hati dari bawah
        function createHeart() {
            const emotes = ['💘', '💗', '⭐', '✨'];
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerText = emotes[Math.floor(Math.random() * emotes.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 7000);
        }

        // Jalankan animasi
        setInterval(createShootingStar, 2000);
        setInterval(createHeart, 500);
    </script>
</body>
</html>
